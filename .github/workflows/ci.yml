name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Keep in sync with config/features in project.godot.
  GODOT_VERSION: 4.7.2

jobs:
  gdscript:
    name: GDScript lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "gdtoolkit==4.*"
      - run: gdlint .
      - run: gdformat --check .

  smoke-test:
    name: Godot import and smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: '"$GODOT" --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/import.log"'

      - name: Run main scene for 120 frames
        run: '"$GODOT" --headless --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/run.log"'

      - name: Fail on engine or script errors
        run: |
          if grep -nE "SCRIPT ERROR|ERROR:|Parse Error" "$RUNNER_TEMP/import.log" "$RUNNER_TEMP/run.log"; then
            echo "::error::Godot reported errors, see the lines above."
            exit 1
          fi
